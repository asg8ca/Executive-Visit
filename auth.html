<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosch Brazil - Executive Visit Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <!-- Supergraphic de fundo em alta resolução -->
    <div class="auth-background-graphic"></div>

    <div class="auth-container">
        <div class="card auth-card">
            <!-- Barra Supergraphic integrada no topo do card -->
            <div class="supergraphic"></div>

            
            <p class="info-text">
                Access using your <strong>Bosch ID</strong> (Ex: ATO8CA). This system is restricted to authorized Executive Visit participants.
            </p>

            <form id="login-form">
                <div class="input-group">
                    <label for="username">User ID (NTID)</label>
                    <input type="text" id="username" placeholder="Ex: ATO8CA" required autocomplete="username" style="text-transform:uppercase;">
                </div>

                <div id="login-error" style="display:none; background:#fff0f1; border:1px solid #ea0016; color:#c0001a; border-radius:4px; padding:10px 14px; font-size:0.875rem; margin-bottom:12px;"></div>

                <button type="submit" class="bosch-btn-primary">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Script único de autenticação e navegação -->
    <script src="script.js"></script>
</body>
</html>
